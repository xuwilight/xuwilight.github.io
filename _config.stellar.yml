######## Stellar 2 主题配置 ########
# 你可以在这里覆盖主题 _config.yml 中的任何配置项
# 完整配置参考: https://xaoxuu.com/wiki/stellar/

# 左侧栏品牌区域
leftbar:
  enabled: true
  brand:
    search: true
    style: regular
    image:
      src: /assets/avatar.jpg
      variant: avatar
    name: xuwilight
    tagline: ''
    href: /

  # 侧边栏主导航菜单
  menu_columns: 3
  menu:
    - id: post
      icon: default:home
      title: 博客
      url: /
    - id: categories
      icon: default:category
      title: 分类
      url: /categories/
    - id: about
      icon: default:profile
      title: 关于
      url: /about/

  # 侧边栏底部社交链接和主题切换
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/xuwilight
      - type: button
        icon: default:theme
        title: 切换主题
        onclick: "setColorScheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')"

# 页面布局配置
profiles:
  home:
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - categories
        - tagcloud

  blog_index:
    path: /blog/
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets: []

  wiki_index:
    path: /wiki/
    active_menu:
    leftbar:
      widgets:
        - related
        - recent
    rightbar:
      widgets: []

  post:
    active_menu: post
    leftbar:
      widgets:
        - related
        - recent
    rightbar:
      widgets:
        - toc

  wiki:
    active_menu:
    leftbar:
      widgets:
        - tree
        - related
        - recent
    rightbar:
      widgets:
        - toc

  page:
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - toc

# 文章配置
article:
  style: tech
  listing:
    excerpt_length: 200
  footer:
    license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
    share: []

# 搜索
search:
  provider: local
  local:
    scope: all
    include_content: true

# 评论（配置评论服务后填写 provider）
comments:
  provider:
  title: 快来参与讨论吧~

# 外观
appearance:
  # 原配置使用半透明侧栏和模糊效果，使用 glass 外观迁移
  preset: glass
  color_scheme: auto
  colors:
    primary: '#1BCDFC'

  typography:
    font_family:
      body: '"LXGW WenKai", "Noto Sans SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif'
      code: '"Monaco", "Consolas", "Cascadia Code", "JetBrains Mono", "Fira Code", Menlo,  "Courier New", monospace'
    font_size:
      root: 16px
      inline_code: 85%
      code_block: 0.8125rem

  shape:
    radius:
      card_large: 16px
      card: 8px
      card_small: 8px
      bar: 8px
      image_large: 24px
      image: 16px
      image_small: 8px

  backgrounds:
    leftbar:
      type: none
      backdrop:
        radius: 100px
    page:
      image:
      backdrop:
        radius: 100px
        saturation: 100%

# 功能
features:
  math:
    provider: mathjax
  color_scheme_switch:
    enabled: true

# 字体与自定义样式（Stellar 2 不再读取根配置 _config.yml 的 inject）
inject:
  head_end: |
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
    <link rel="stylesheet" href="/css/custom.css">
