######## Stellar 2 主题配置 ########
# 你可以在这里覆盖主题 _config.yml 中的任何配置项
# 完整配置参考: https://xaoxuu.com/wiki/stellar/

# 左侧栏品牌区域
leftbar:
  enabled: true
  brand:
    search: true
    style: regular
    image:
      src: /assets/avatar.jpg
      variant: avatar
    name: xuwilight
    tagline: ''
    href: /

  # 侧边栏主导航菜单
  menu_columns: 3
  menu:
    - id: post
      icon: default:documents
      title: 博客
      url: /
    - id: categories
      icon: default:category
      title: 分类
      url: /categories/
    - id: about
      icon: default:profile
      title: 关于
      url: /about/

  # 侧边栏底部社交链接和主题切换
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/xuwilight
      - type: button
        icon: default:theme
        title: 切换主题
        onclick: "setColorScheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')"

# 页面布局配置
profiles:
  home:
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - categories
        - tagcloud

  blog_index:
    path: /blog/
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets: []

  wiki_index:
    path: /wiki/
    active_menu:
    leftbar:
      widgets:
        - related
        - recent
    rightbar:
      widgets: []

  post:
    active_menu: post
    leftbar:
      widgets:
        - related
        - recent
    rightbar:
      widgets:
        - toc

  wiki:
    active_menu:
    leftbar:
      widgets:
        - tree
        - related
        - recent
    rightbar:
      widgets:
        - toc

  page:
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - toc

# 文章配置
article:
  style: tech
  paragraph_indent: never
  banner:
    background: false
  listing:
    excerpt_length: 180
    card_layout: hero
    cover_ratio: 2
    show_tags: false
  show_reading_time: true
  footer:
    license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
    share: []

# 搜索
search:
  provider: local
  local:
    scope: all
    include_content: true

# 评论（配置评论服务后填写 provider）
comments:
  provider:
  title: 快来参与讨论吧~

# 外观
appearance:
  # Editorial Minimal：弱化容器装饰，让排版、留白和内容成为视觉重点
  preset: minimal
  color_scheme: auto
  colors:
    primary: '#2563EB'
    accent: '#0F766E'
    link: '#2563EB'

  typography:
    font_smoothing: antialiased
    font_family:
      body: '"Noto Serif SC", system-ui, "Microsoft YaHei", "Segoe UI", Arial, sans-serif'
      code: 'Monaco, Menlo, Consolas, system-ui, monospace, sans-serif'
    font_weight:
      400: 300
      500: 700
      600: 700
      700: 700
    font_size:
      root: 16px
      inline_code: 85%
      code_block: 0.875rem
    content_align: left

  shape:
    corner: superellipse(1.15)
    radius:
      card_large: 18px
      card: 12px
      card_small: 8px
      bar: 10px
      image_large: 20px
      image: 12px
      image_small: 8px

  backgrounds:
    leftbar:
      type: none
      backdrop:
        radius: 100px
    page:
      image:
      backdrop:
        radius: 100px
        saturation: 100%
  code_block:
    scrollbar_width: 6px

# 功能
features:
  math:
    provider: mathjax
    mathjax:
      js: https://gcore.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.min.js
  color_scheme_switch:
    enabled: true

# 字体与自定义样式（Stellar 2 不再读取根配置 _config.yml 的 inject）
inject:
  head_end: |
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/chinese-simplified-300.css">
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/chinese-simplified-700.css">
    <link rel="stylesheet" href="/css/custom.css">
